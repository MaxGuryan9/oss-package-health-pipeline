version: 2

models:
  - name: fct_pull_requests
    description: >
      One row per PR created on or after 2024-01-01, with durations (hours) and flags
      precalculated. Open PRs are kept and marked is_open; their merge and close durations
      are NULL. Reviews by the PR author and by bots do not count as reviews.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, number]
    columns:
      - name: repo
        description: GitHub repository (owner/name).
        data_tests:
          - not_null
      - name: number
        description: PR number, unique within a repo.
        data_tests:
          - not_null
      - name: author_login
        description: GitHub login of the PR author.
      - name: author_is_bot
        description: True when the author's type is Bot or the login ends in [bot].
      - name: state
        description: open or closed, as reported by GitHub.
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: When the PR was opened (UTC).
        data_tests:
          - not_null
      - name: updated_at
        description: Last activity on the PR (UTC).
      - name: closed_at
        description: When the PR was closed, merged or not (UTC). NULL if open.
      - name: merged_at
        description: When the PR was merged (UTC). NULL unless merged.
      - name: is_merged
        description: merged_at is not null.
      - name: is_closed_unmerged
        description: Closed without being merged.
      - name: is_open
        description: Still open at run time.
      - name: first_review_at
        description: Earliest non-author, non-bot review. NULL if never reviewed.
      - name: hours_to_first_review
        description: Hours from created_at to first_review_at. NULL if never reviewed.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: hours_to_merge
        description: Hours from created_at to merged_at. NULL unless merged.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: hours_to_close
        description: Hours from created_at to closed_at, merged or not. NULL if open.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_stale
        description: Open and no activity in the 180 days before run time.
      - name: has_approving_review
        description: Any non-author, non-bot review with state APPROVED.
      - name: reviewed_within_7d
        description: hours_to_first_review <= 168. False if never reviewed.

  - name: fct_releases
    description: >
      One row per published (non-draft) release on or after 2024-01-01. Gaps are measured
      before the window filter, so the first 2024 release still has its gap to the prior release.
      Prereleases are kept and flagged.
    columns:
      - name: repo
        description: GitHub repository (owner/name).
      - name: id
        description: GitHub release id.
        data_tests:
          - unique
          - not_null
      - name: tag_name
        description: Git tag of the release, e.g. v6.1.0.
      - name: published_at
        description: When the release was published (UTC).
        data_tests:
          - not_null
      - name: is_prerelease
        description: True for release candidates and betas.
      - name: days_since_previous
        description: Days since the previous release of any kind in the same repo. NULL for a repo's first release.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: days_since_previous_full
        description: Days since the previous full (non-prerelease) release. NULL for prereleases and a repo's first full release.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mart_repo_monthly
    description: >
      One row per repo x month, January 2024 through the run month. Months with no activity
      show 0. Each event counts in the month it happened. Medians skip NULLs, so unreviewed
      PRs drop out of median_first_review_hours and unmerged PRs drop out of median_merge_hours.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [repo, month]
    columns:
      - name: repo
        description: GitHub repository (owner/name).
      - name: month
        description: First day of the month.
        data_tests:
          - not_null
      - name: month_index
        description: Months since January 2024 (0 = Jan 2024). x-axis for trend slopes.
      - name: prs_opened
        description: PRs created this month.
      - name: prs_merged
        description: PRs merged this month.
      - name: prs_closed_unmerged
        description: PRs closed without merging this month.
      - name: median_first_review_hours
        description: Median hours to first review of PRs opened this month.
      - name: median_merge_hours
        description: Median hours to merge of PRs merged this month.
      - name: commits
        description: Commits authored this month.
      - name: active_contributors
        description: Distinct non-bot authors who opened a PR this month.
      - name: top_author_share
        description: Share of this month's non-bot merged PRs written by the single most active author. NULL when none were merged.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_partial_month
        description: True for the run month, which is not yet complete.
      - name: merge_ratio
        description: prs_merged / (prs_merged + prs_closed_unmerged). NULL when both are 0.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_health_inputs
    description: >
      One row per repo, one column per metric scored in Task 5. Every column is a share,
      ratio or slope, never a raw count, so a large repo cannot win by volume alone.
    columns:
      - name: repo
        description: GitHub repository (owner/name).
        data_tests:
          - unique
          - not_null
      - name: pct_reviewed_within_7d
        description: Responsiveness. Share of PRs at least 7 days old that got a non-author, non-bot review within 7 days. Higher is healthier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: merge_rate
        description: Throughput. Merged / (merged + closed unmerged). Higher is healthier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: pct_open_stale
        description: Backlog. Share of open PRs with no activity in 180+ days. Lower is healthier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: release_gap_cv
        description: Release cadence. Standard deviation / mean of days between full releases (0 = perfectly regular). Lower is healthier.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: commit_trend
        description: Activity trend. Slope of monthly commits over complete months / average monthly commits (change per month as a share of a typical month). Higher is healthier.
        data_tests:
          - not_null
      - name: top_author_share_trend
        description: Contributor-base trend. Slope of monthly top_author_share over complete months (change in share per month). Lower is healthier.
        data_tests:
          - not_null
